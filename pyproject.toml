[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "upi-fraud-ids"
version = "1.0.0"
description = "Real-Time Intrusion Detection System for UPI Payments using AI & Machine Learning (hybrid rules + XGBoost + Isolation Forest + SHAP)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
  {name = "Hitesh Kumar"}, {name = "Raj Aryan"}, {name = "Raghvendra Pandey"}, {name = "Shivam Kumar"}
]
dependencies = [
  "numpy>=1.26", "pandas>=2.1", "scikit-learn>=1.4", "xgboost>=2.0", "imbalanced-learn>=0.12",
  "shap>=0.45", "matplotlib>=3.8", "fastapi>=0.110", "uvicorn[standard]>=0.29", "pydantic>=2.6",
  "PyJWT>=2.8", "pyyaml>=6.0", "httpx>=0.27",
]

[project.optional-dependencies]
infra = ["redis>=5.0", "kafka-python>=2.0", "psycopg2-binary>=2.9"]
dev = ["pytest>=8.0"]

[project.scripts]
upi-ids = "upi_ids.cli:main"

[tool.setuptools.packages.find]
include = ["upi_ids*"]

[tool.setuptools.package-data]
"upi_ids.api" = ["dashboard/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
