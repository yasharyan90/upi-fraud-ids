# Default configuration for the UPI hybrid intrusion detection prototype.
seed: 42

data:
  n_train: 40000          # synthetic training transactions
  n_eval: 10000           # evaluation batch (paper: N = 10,000)
  eval_fraud_count: 100   # exactly 1% fraud in the evaluation batch (paper: 9,900 / 100)
  train_fraud_rate: 0.01
  n_users: 2500

imbalance:
  use_smote: true
  smote_k_neighbors: 5
  smote_sampling_strategy: 0.10   # minority:majority ratio after resampling (training partition only)
  class_weighting: true

xgboost:
  n_estimators: 400
  max_depth: 6
  learning_rate: 0.05
  subsample: 0.9
  colsample_bytree: 0.9
  min_child_weight: 2
  reg_lambda: 1.0
  reg_alpha: 0.0
  decision_threshold: 0.5

isolation_forest:
  n_estimators: 200
  contamination: 0.01

rules:
  max_amount: 50000          # INR; "excessive transfer amount"
  burst_count_1hr: 8         # "abnormal transaction burst"
  max_failed_attempts: 3     # "repeated authentication failure"
  impossible_speed_kmph: 900 # "impossible geographic transition"
  far_distance_km: 500

risk:
  weights: {rule: 0.30, supervised: 0.50, anomaly: 0.20}
  thresholds: {challenge: 0.30, alert: 0.60, block: 0.85}   # tau1 < tau2 < tau3

api:
  jwt_secret: "change-me-in-production"
  jwt_exp_minutes: 60
  rate_limit_per_minute: 120
  mfa_required_for_admin: true

monitoring:
  drift_psi_threshold: 0.2
  audit_log_path: "results/audit_log.jsonl"
